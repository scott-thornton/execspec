name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    # macOS runner: the Swift side of the gate needs the Swift 6 toolchain
    # and the runtime currently targets Darwin (POSIX read/write).
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm run check
